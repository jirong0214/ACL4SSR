;设置分组标志位
custom_proxy_group=Proxy`select`[]♻️ Auto`[]🔯 Fallback`[]🔮 Balance`[]HK`[]TW`[]SG`[]JP`[]US`[]KR`[]🚀 Manual`[]DIRECT
custom_proxy_group=🚀 Manual`select`.*
